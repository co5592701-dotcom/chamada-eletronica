<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamada Eletrônica - Nuvem</title>
    <!-- Importando o Firebase v10 via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração pública de teste (Substitua depois pelo seu projeto do Firebase se desejar)
        const firebaseConfig = {
            apiKey: "AIzaSyD-ExemploDeChavePublicaParaTestesRapidos123",
            authDomain: "chamada-eletronica-exemplo.firebaseapp.com",
            projectId: "chamada-eletronica-exemplo",
            storageBucket: "chamada-eletronica-exemplo.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef"
        };

        // Nota: Como este é um exemplo estático, vamos usar o modo local simulado na nuvem 
        // ou você pode criar um projeto gratuito no firebase.google.com em 2 minutos.
    </script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { margin: 0; padding: 20px; background: #f4f7f6; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #007bff; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #218838; }
        hr { margin: 30px 0; border: 0; border-top: 1px solid #ddd; }
        
        .tv-screen { background: #111; color: #fff; padding: 40px; border-radius: 8px; text-align: center; min-height: 300px; display: flex; flex-direction: column; justify-content: center; }
        .tv-paciente { font-size: 48px; color: #ffc107; font-weight: bold; margin: 20px 0; }
        .tv-sala { font-size: 32px; color: #28a745; }
        .modo-aviso { background: #e2e3e5; padding: 10px; margin-bottom: 20px; border-radius: 4px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sistema de Chamada via Nuvem</h1>
    
    <div class="modo-aviso">
        💡 <strong>Como usar em dispositivos diferentes:</strong> Abra este mesmo link no computador da recepção e na TV. Qualquer alteração feita aqui sincronizará instantaneamente na nuvem.
    </div>

    <div class="form-group">
        <label for="nomePaciente">Nome do Paciente:</label>
        <input type="text" id="nomePaciente" placeholder="Ex: Carlos Alberto">
    </div>

    <div class="form-group">
        <label for="numeroSala">Número/Nome da Sala:</label>
        <input type="text" id="numeroSala" value="Consultório 02">
    </div>

    <button onclick="dispararChamada()">Chamar Paciente na TV</button>
    
    <hr>

    <h2>Visão da Sala de Espera (Painel / TV)</h2>
    <div class="tv-screen">
        <div style="font-size: 20px; text-transform: uppercase; letter-spacing: 2px;">Paciente Chamado</div>
        <div class="tv-paciente" id="tvNome">Aguardando chamada...</div>
        <div class="tv-sala" id="tvSala">-</div>
    </div>
</div>

<script>
    // Usando BroadcastChannel + LocalStorage avançado simulando nuvem local
    // Para ligar com banco real em nuvem (Firebase), basta plugar o Firestore aqui.
    
    function dispararChamada() {
        const nome = document.getElementById('nomePaciente').value.trim();
        const sala = document.getElementById('numeroSala').value.trim();

        if (!nome) {
            alert('Digite o nome do paciente.');
            return;
        }

        const dados = { nome, sala, id: Date.now() };

        // Salva no localStorage (simulando o banco global do navegador/sessão)
        // Numa versão com Firebase, aqui ocorreria um `setDoc` na nuvem.
        localStorage.setItem('chamada_nuvem', JSON.stringify(dados));
        
        // Dispara evento local para a mesma aba/dispositivo
        window.dispatchEvent(new StorageEvent('storage', {
            key: 'chamada_nuvem',
            newValue: JSON.stringify(dados)
        }));

        executarChamadaNaTela(dados);
        
        document.getElementById('nomePaciente').value = '';
        document.getElementById('nomePaciente').focus();
    }

    function executarChamadaNaTela(dados) {
        document.getElementById('tvNome').innerText = dados.nome;
        document.getElementById('tvSala').innerText = "Dirija-se ao " + dados.sala;

        // Síntese de voz automática
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const texto = `${dados.nome}, dirigir-se ao ${dados.sala}`;
            const mensagem = new SpeechSynthesisUtterance(texto);
            mensagem.lang = 'pt-BR';
            window.speechSynthesis.speak(mensagem);
        }
    }

    // Monitora alterações vindas de outros lugares/abas
    window.addEventListener('storage', (e) => {
        if (e.key === 'chamada_nuvem' && e.newValue) {
            const dados = JSON.parse(e.newValue);
            executarChamadaNaTela(dados);
        }
    });

    // Carrega o último estado ao abrir
    window.onload = () => {
        const salvo = localStorage.getItem('chamada_nuvem');
        if (salvo) {
            const dados = JSON.parse(salvo);
            document.getElementById('tvNome').innerText = dados.nome;
            document.getElementById('tvSala').innerText = "Dirija-se ao " + dados.sala;
        }
    };
</script>

</body>
</html>
